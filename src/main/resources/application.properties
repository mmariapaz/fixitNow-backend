spring.application.name=backend

# Configuracion de base de datos H2 en archivo local para desarrollo
spring.datasource.url=jdbc:h2:file:./data/fixitnowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA: update para preservar los datos entre reinicios locales
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola H2 para inspeccion durante desarrollo local
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
